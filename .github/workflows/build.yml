name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          cache: true

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release --output-on-failure

      # ── Windows packaging ──────────────────────────────────────────
      - name: Package (Windows)
        if: runner.os == 'Windows'
        working-directory: build/release
        run: cpack -G ZIP

      # ── macOS packaging ────────────────────────────────────────────
      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: build/release
        run: cpack -G DragNDrop

      # ── Linux AppImage ─────────────────────────────────────────────
      - name: Install to AppDir
        if: runner.os == 'Linux'
        run: cmake --install build/release --prefix "$PWD/AppDir/usr"

      - name: Create .desktop entry
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/share/applications
          cat > AppDir/usr/share/applications/zte-tools.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=ZTE Tools
          Exec=zte-gui
          Icon=zte-gui
          Categories=Utility;
          EOF

      - name: Create placeholder icon
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          cat > AppDir/usr/share/icons/hicolor/scalable/apps/zte-gui.svg << 'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
            <rect width="128" height="128" rx="16" fill="#1976D2"/>
            <text x="64" y="78" text-anchor="middle" font-size="48" font-family="sans-serif" font-weight="bold" fill="white">ZTE</text>
          </svg>
          SVG

      - name: Download linuxdeploy
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy

      - name: Download linuxdeploy Qt plugin
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          chmod +x linuxdeploy-plugin-qt

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: ./linuxdeploy --appdir AppDir --plugin qt --output appimage

      # ── Upload artifacts ───────────────────────────────────────────
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            build/release/zte-tools-*.zip
            build/release/*.dmg
            *-x86_64.AppImage
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: packages-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
          generate_release_notes: true
